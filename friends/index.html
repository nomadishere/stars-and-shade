<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Friends & Groups · Stars & Shade</title>
<meta name="description" content="Invite friends, see your charts together, and get daily readings for every pair and group.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Astro'; src: url('../fonts/dejavu-astro.woff2') format('woff2'); font-weight: 700; font-display: block; }
  :root { color-scheme: dark; --night: #07050d; --ink: #f3ecf9; --muted: #b9add0; --gold: #f2c466; --gold-hi: #ffe3a3; --gold-deep: #c48a2c; --pink: #ff8fc8; --line: #2f2546; --teal: #40e0d0;
    --display: 'Comfortaa', 'Trebuchet MS', system-ui, sans-serif; --body: 'Figtree', system-ui, -apple-system, sans-serif; --st: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; color: var(--ink); font: 16px/1.5 var(--body); background: radial-gradient(130% 60% at 50% 0%, #3a1450 0%, #1a0b2c 45%, var(--night) 85%) fixed; min-height: 100vh; }
  .top { display: flex; align-items: center; gap: 8px; padding: calc(var(--st) + 12px) 14px 6px; max-width: 760px; margin: 0 auto; }
  .top .sp { flex: 1; }
  .pill { display: inline-flex; align-items: center; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line); background: rgba(18,12,30,.7); text-decoration: none; }
  .pill img { height: 22px; display: block; }
  main { max-width: 760px; margin: 0 auto; padding: 4px 14px 120px; }
  h1 { font: 700 29px/1.15 var(--display); margin: 10px 0 4px; text-align: center; background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-deep)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 14px; font-size: 14.5px; }
  h2 { font: 700 20px var(--display); color: var(--gold); margin: 26px 0 10px; }
  .invite { border-radius: 22px; padding: 18px 16px; text-align: center; background: linear-gradient(150deg, rgba(255,95,168,.22), rgba(180,77,255,.18)); border: 1px solid rgba(255,143,200,.5); box-shadow: 0 0 30px rgba(255,95,168,.18); }
  .invite p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
  .big { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; max-width: 360px; padding: 15px 18px; border-radius: 999px; border: 0; cursor: pointer;
    background: linear-gradient(135deg, #ff5fa8, #b44dff); color: #fff; font: 800 17px var(--body); box-shadow: 0 0 18px rgba(255,95,168,.45); text-decoration: none; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 16px; border-radius: 999px; border: 0; cursor: pointer; font: 800 14.5px var(--body); color: #1b1206; background: linear-gradient(180deg, var(--gold-hi), var(--gold) 50%, var(--gold-deep)); text-decoration: none; }
  .ghost { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 14px; border-radius: 999px; cursor: pointer; font: 700 14px var(--body); color: var(--ink); border: 1px solid var(--line); background: rgba(18,12,30,.6); text-decoration: none; }
  .ghost.t { border-color: rgba(64,224,208,.5); color: #a8fff4; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .p { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: rgba(30,14,50,.55); }
  .p .av { flex: 0 0 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font: 800 17px var(--display); color: #1b1206; background: linear-gradient(160deg, var(--gold-hi), var(--pink)); }
  .p .av.g { background: linear-gradient(160deg, #a8fff4, #b44dff); font-size: 15px; }
  .p .tx { flex: 1; min-width: 0; }
  .p .tx b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p .tx small { display: block; color: var(--muted); font-size: 13px; line-height: 1.35; }
  .p .acts { display: flex; gap: 6px; flex: 0 0 auto; }
  .p .acts button, .p .acts a { padding: 8px 12px; font-size: 13.5px; }
  a.p { color: inherit; text-decoration: none; }
  .day { padding: 12px 14px; border-radius: 16px; border: 1px solid rgba(64,224,208,.35); background: rgba(64,224,208,.06); display: block; color: inherit; text-decoration: none; }
  .day b { color: #fff; } .day span { display: block; font-size: 14.5px; margin-top: 3px; color: #e7dcf5; }
  .empty { color: var(--muted); font-size: 14.5px; padding: 6px 2px; }
  input[type=text], input[type=search] { width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.07); color: inherit; font: inherit; font-size: 16px; }
  .wheel { width: 100%; max-width: 560px; margin: 6px auto; } .wheel svg { width: 100%; height: auto; display: block; font-family: var(--body); }
  .meters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  .mt { padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: rgba(30,14,50,.6); text-align: center; }
  .mt b { display: block; font: 700 26px var(--display); color: var(--gold-hi); } .mt small { color: var(--muted); font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; }
  .asp { padding: 10px 12px; border-bottom: 1px solid rgba(47,37,70,.7); font-size: 15px; } .asp i { display: block; color: #d9c9ef; font-size: 13px; }
  .bar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
  .read { padding: 14px 16px; border-radius: 18px; border: 1px solid rgba(242,196,102,.4); background: rgba(242,196,102,.06); white-space: pre-wrap; font-size: 15.5px; }
  .note { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chips button { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(18,12,30,.6); color: var(--muted); font: 700 13.5px var(--body); }
  .chips button[aria-pressed=true] { color: #1b1206; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); border-color: transparent; }
  .chk { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); margin: 6px 0; background: rgba(30,14,50,.5); }
  .chk input { width: 22px; height: 22px; accent-color: #ff5fa8; }
  .sheet { position: fixed; inset: 0; z-index: 70; background: rgba(8,4,20,.78); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); overflow-y: auto; padding: calc(var(--st) + 20px) 14px 40px; }
  .sheet[hidden] { display: none; }
  .sheet .box { max-width: 460px; margin: 0 auto; padding: 18px; border-radius: 22px; background: linear-gradient(160deg, #2a0f3d, #150a26); border: 1px solid rgba(255,111,181,.35); }
  .sheet h3 { margin: 0 0 8px; font: 700 21px var(--display); color: var(--gold); }
  .err { color: #ffb3d6; font-size: 14px; min-height: 1em; margin-top: 8px; }
  .back { margin: 4px 0 0; }
  #maker { max-width: 520px; margin: 10px auto; }
  .tog { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(30,14,50,.5); margin: 8px 0; }
  .tog input { width: 24px; height: 24px; accent-color: #ff5fa8; flex: 0 0 auto; }
</style>
</head>
<body>
<div class="top">
  <a class="pill" href="../" aria-label="Stars &amp; Shade home"><img src="../img/logo.png" alt="Stars &amp; Shade"></a>
  <span class="sp"></span>
  <span id="ssnav"></span>
</div>
<main id="main"><h1>Friends &amp; Groups</h1><p class="sub">Loading…</p></main>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Details"><div class="box" id="sheetBox"></div></div>

<script src="../vendor/astronomy/astronomy-2.1.19.min.js"></script>
<script src="../js/chart.js?v=28"></script>
<script src="../js/cards.js?v=28"></script>
<script src="../js/chartmaker.js?v=19"></script>
<script src="../js/sky.js?v=28"></script>
<script src="../js/wheel.js?v=28"></script>
<script src="../vendor/supabase/supabase-2.118.0.js"></script>
<script src="../js/account.js?v=31"></script>
<script src="../js/social.js?v=28"></script>
<script>
(() => {
  const X = window.SSSocial, Acct = window.SSAcct, $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ini = n => esc(String(n || '?').trim().charAt(0).toUpperCase() || '?');
  const KINDS = [['friends', 'Friends'], ['couple', 'Couple'], ['poly', 'Polycule'], ['family', 'Family'], ['crew', 'Crew / band'], ['other', 'Other']];
  const main = $('main'), sheet = $('sheet'), box = $('sheetBox');
  let S = null;   // social data
  const qs = new URLSearchParams(location.search);
  const openSheet = html => { box.innerHTML = html; sheet.hidden = false; const x = box.querySelector('[data-close]'); if (x) x.onclick = closeSheet; };
  const closeSheet = () => { sheet.hidden = true; };
  sheet.onclick = e => { if (e.target === sheet) closeSheet(); };
  const who = p => esc(p.name || '@' + p.handle);
  const sunMoon = pl => { if (!pl) return 'No chart yet'; const s = X.SIGNS, sg = l => s[Math.floor(((l % 360) + 360) % 360 / 30)];
    return `☉ ${sg(pl.planets[0].lon)} · ☽ ${sg(pl.planets[1].lon)}${pl.asc != null ? ' · AC ' + sg(pl.asc) : ''}`; };
  const inviteBlock = (sm) => `<div class="invite"><button class="big" type="button" data-invite>＋ Invite friends</button>
    <p>${sm || 'Send your link by text. When they make their free chart you’re instantly friends, and your pair reading is ready.'}</p></div>`;
  function wireInvite(root) { (root || document).querySelectorAll('[data-invite]').forEach(b => b.onclick = () => X.shareInvite(S.me.invite_code, S.me.name, b)); }

  async function load() {
    await Acct.ready;
    if (!Acct.user) {
      main.innerHTML = `<h1>Friends &amp; Groups</h1><p class="sub">See your charts together: pair readings for you and your person, group readings for your friends, family, crew or polycule, and a fresh one every day.</p>
        <div class="invite"><button class="big" type="button" id="up">✦ Make a free account</button><p>Already have one? <a href="#" id="in" style="color:var(--pink)">Sign in</a></p></div>`;
      $('up').onclick = () => Acct.open('up'); $('in').onclick = e => { e.preventDefault(); Acct.open('in'); };
      return;
    }
    await X.acceptPending();
    await X.syncMe();
    try { S = await X.api.social(); } catch (e) { main.innerHTML = `<h1>Friends &amp; Groups</h1><p class="sub">Couldn’t load your people right now. ${esc(e.message)}</p>`; return; }
    if (qs.get('pair')) return showPair(qs.get('pair'));
    if (qs.get('group')) return showGroup(qs.get('group'));
    home();
  }
  Acct.onChange(() => load());

  const myPl = () => S.me.placements;
  const pairOf = f => (myPl() && f.placements) ? X.composite([myPl(), f.placements]) : null;
  const groupPls = g => (g.members || []).filter(m => m.status === 'joined' && m.placements).map(m => m.placements);

  function home() {
    const f = S.friends, g = S.groups.filter(x => x.my_status === 'joined'), gi = S.groups.filter(x => x.my_status === 'invited');
    const today = [];
    for (const fr of f) { const c = pairOf(fr); if (c) today.push(`<a class="day" href="?pair=${fr.id}"><b>You + ${who(fr)}</b><span>${esc(X.dailyLine(c))}</span></a>`); }
    for (const gr of g) { const pls = groupPls(gr); if (pls.length >= 2) today.push(`<a class="day" href="?group=${gr.id}"><b>${esc(gr.name)}</b><span>${esc(X.dailyLine(X.composite(pls)))}</span></a>`); }
    main.innerHTML = `<h1>Friends &amp; Groups</h1><p class="sub">@${esc(S.me.handle)} · ${f.length} friend${f.length === 1 ? '' : 's'} · ${S.followers} follower${S.followers === 1 ? '' : 's'}</p>
      ${myPl() ? '' : '<div class="invite" style="margin-bottom:14px"><b>Make your chart first</b><p>Your friends only ever see your placements, never your birth date, time or place.</p><div id="maker"></div></div>'}
      ${inviteBlock()}
      ${today.length ? `<h2>Today with your people</h2><div class="list">${today.join('')}</div>` : ''}
      ${S.incoming.length ? `<h2>Friend requests</h2><div class="list">${S.incoming.map(p => person(p, `<button class="btn" data-acc="${p.id}">Accept</button><button class="ghost" data-dec="${p.id}">✕</button>`)).join('')}</div>` : ''}
      ${gi.length ? `<h2>Group invites</h2><div class="list">${gi.map(x => `<div class="p"><span class="av g">✦</span><span class="tx"><b>${esc(x.name)}</b><small>${(x.members || []).length} people</small></span><span class="acts"><button class="btn" data-join="${x.id}">Join</button><button class="ghost" data-leave="${x.id}">✕</button></span></div>`).join('')}</div>` : ''}
      <h2>Friends</h2><div class="list">${f.length ? f.map(p => `<a class="p" href="?pair=${p.id}"><span class="av">${ini(p.name || p.handle)}</span><span class="tx"><b>${who(p)}</b><small>${sunMoon(p.placements)}</small></span><span class="acts"><span class="ghost">Our chart ›</span></span></a>`).join('') : '<p class="empty">No friends yet. Tap “Invite friends” and text your link.</p>'}</div>
      <h2>Groups</h2><p class="empty" style="margin-top:-6px">Couples, friend groups, family, your crew, a polycule: any 2 or more people.</p>
      <div class="list">${g.map(x => `<a class="p" href="?group=${x.id}"><span class="av g">${(x.members || []).length}</span><span class="tx"><b>${esc(x.name)}</b><small>${esc((KINDS.find(k => k[0] === x.kind) || [, ''])[1])} · ${(x.members || []).map(m => esc(m.name || m.handle)).join(', ')}</small></span><span class="acts"><span class="ghost">Group chart ›</span></span></a>`).join('')}</div>
      <div class="row"><button class="ghost" type="button" id="newG">＋ New group</button></div>
      <h2>Find people</h2><input type="search" id="q" placeholder="Search by @handle or a public name" autocomplete="off" enterkeyhint="search"><div class="list" id="res" style="margin-top:8px"></div>
      ${S.outgoing.length ? `<h2>Sent requests</h2><div class="list">${S.outgoing.map(p => person(p, `<button class="ghost" data-dec="${p.id}">Cancel</button>`)).join('')}</div>` : ''}
      ${S.following.length ? `<h2>Following</h2><div class="list">${S.following.map(p => person(p, `<button class="ghost" data-unf="${p.id}">Unfollow</button>`)).join('')}</div>` : ''}
      <h2>My profile</h2>
      <div class="tog"><span><b>Public profile</b><br><small style="color:var(--muted)">Anyone can find and follow you and see your placements. Off: only friends and your groups.</small></span><input type="checkbox" id="pub" ${S.me.is_public ? 'checked' : ''} aria-label="Public profile"></div>
      <div class="row"><button class="ghost" type="button" id="editMe">Edit name, @handle and bio</button><button class="ghost" type="button" data-copy>Copy my invite link</button></div>`;
    if (!myPl()) window.SSMaker.mount($('maker'), { sky: false, title: 'Your free birth chart' });
    wireInvite(); wireActions();
    $('newG').onclick = newGroup;
    $('pub').onchange = async e => { try { await X.api.me({ p_public: e.target.checked }); } catch (x) { e.target.checked = !e.target.checked; } };
    $('editMe').onclick = editMe;
    main.querySelector('[data-copy]').onclick = async e => { try { await navigator.clipboard.writeText(X.inviteUrl(S.me.invite_code)); e.target.textContent = '✓ Copied'; } catch (x) { prompt('Your invite link:', X.inviteUrl(S.me.invite_code)); } };
    if (qs.get('invite')) { const b = main.querySelector('.invite [data-invite]'); if (b) { b.scrollIntoView({ block: 'center' }); b.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.05)' }, { transform: 'scale(1)' }], { duration: 700, iterations: 2 }); } }
    let tmr; $('q').oninput = e => { clearTimeout(tmr); const v = e.target.value.trim(); tmr = setTimeout(() => search(v), 300); };
  }
  function person(p, acts) { return `<div class="p"><span class="av">${ini(p.name || p.handle)}</span><span class="tx"><b>${who(p)}</b><small>@${esc(p.handle)}${p.placements ? ' · ' + sunMoon(p.placements) : ''}</small></span><span class="acts">${acts}</span></div>`; }
  async function search(v) {
    const res = $('res'); if (!res) return; if (v.length < 2) { res.innerHTML = ''; return; }
    let list = []; try { list = await X.api.search(v); } catch (e) { res.innerHTML = `<p class="empty">${esc(e.message)}</p>`; return; }
    const fr = new Set(S.friends.map(p => p.id)), out = new Set(S.outgoing.map(p => p.id)), fol = new Set(S.following.map(p => p.id));
    res.innerHTML = list.length ? list.map(p => person(p, fr.has(p.id) ? `<a class="ghost" href="?pair=${p.id}">Friends ✓</a>` : (out.has(p.id) ? '<span class="ghost">Sent</span>' : `<button class="btn" data-req="${p.id}">Add</button>`) + (p.is_public && !fol.has(p.id) ? `<button class="ghost" data-fol="${p.id}">Follow</button>` : ''))).join('')
      : '<p class="empty">Nobody found. Private profiles only show up by their exact @handle. Easiest: send them your invite link.</p>';
    wireActions(res);
  }
  function wireActions(root) {
    root = root || main;
    const act = (sel, fn) => root.querySelectorAll(sel).forEach(b => b.onclick = async e => { e.preventDefault(); b.disabled = true; try { await fn(b); S = await X.api.social(); route(); } catch (x) { b.disabled = false; alert(x.message); } });
    act('[data-acc]', b => X.api.friend(b.dataset.acc, 'accept'));
    act('[data-dec]', b => X.api.friend(b.dataset.dec, 'decline'));
    act('[data-req]', b => X.api.friend(b.dataset.req, 'request'));
    act('[data-fol]', b => X.api.follow(b.dataset.fol, true));
    act('[data-unf]', b => X.api.follow(b.dataset.unf, false));
    act('[data-join]', b => X.api.group('join', { p_group: b.dataset.join }));
    act('[data-leave]', b => X.api.group('leave', { p_group: b.dataset.leave }));
  }
  function route() { const p = new URLSearchParams(location.search); if (p.get('pair')) showPair(p.get('pair')); else if (p.get('group')) showGroup(p.get('group')); else home(); }

  function editMe() {
    openSheet(`<h3>My profile</h3><label>Name<input type="text" id="eN" value="${esc(S.me.name)}" maxlength="60"></label><br><br>
      <label>@handle<input type="text" id="eH" value="${esc(S.me.handle)}" maxlength="24" autocapitalize="off" autocomplete="off"></label><br><br>
      <label>Bio<input type="text" id="eB" value="${esc(S.me.bio)}" maxlength="160" placeholder="Optional"></label><div class="err" id="eE"></div>
      <div class="row"><button class="btn" id="eS" type="button">Save</button><button class="ghost" data-close type="button">Cancel</button></div>`);
    $('eS').onclick = async () => { try { await X.api.me({ p_name: $('eN').value.trim(), p_handle: $('eH').value.trim().replace(/^@/, ''), p_bio: $('eB').value.trim() }); S = await X.api.social(); closeSheet(); home(); } catch (e) { $('eE').textContent = e.message; } };
  }
  function newGroup(preset) {
    if (!S.friends.length) { openSheet(`<h3>New group</h3><p>Groups are made from your friends. Invite a few people first.</p>${inviteBlock(' ')}<div class="row"><button class="ghost" data-close type="button">Close</button></div>`); wireInvite(box); return; }
    let kind = 'friends';
    openSheet(`<h3>New group</h3><label>Group name<input type="text" id="gN" maxlength="60" placeholder="The coven, Us three, Family…"></label>
      <div class="chips" id="gK">${KINDS.map(([k, l]) => `<button type="button" data-k="${k}" aria-pressed="${k === kind}">${l}</button>`).join('')}</div>
      <b style="font-size:14px">Who’s in it?</b>${S.friends.map(p => `<label class="chk"><input type="checkbox" value="${p.id}"> ${who(p)}</label>`).join('')}
      <p class="note">Each friend gets an invite and chooses to join. Up to 20 people.</p><div class="err" id="gE"></div>
      <div class="row"><button class="btn" id="gS" type="button">Make the group ✦</button><button class="ghost" data-close type="button">Cancel</button></div>`);
    box.querySelectorAll('#gK button').forEach(b => b.onclick = () => { kind = b.dataset.k; box.querySelectorAll('#gK button').forEach(x => x.setAttribute('aria-pressed', x === b)); });
    $('gS').onclick = async () => {
      const ids = [...box.querySelectorAll('.chk input:checked')].map(i => i.value);
      if (!ids.length) return $('gE').textContent = 'Pick at least one friend.';
      try { const r = await X.api.group('create', { p_name: $('gN').value.trim() || 'My people', p_kind: kind, p_members: ids }); S = await X.api.social(); closeSheet(); history.pushState(null, '', '?group=' + r.id); showGroup(r.id); } catch (e) { $('gE').textContent = e.message; }
    };
  }

  // ---- pair + group pages
  const back = '<p class="back"><a class="ghost" href="./">‹ Friends &amp; Groups</a></p>';
  function readingBlock(kind, id) {
    return `<h2>Skye’s reading</h2><div id="rd"><div class="row"><button class="btn" type="button" id="rFull">✦ Read it in full</button><button class="ghost t" type="button" id="rVoice">🎧 Hear Skye read it</button></div>
      <p class="note">A new one every day, shared by everyone in this ${kind === 'pair' ? 'pair' : 'group'}.</p></div><audio id="aud" hidden></audio>`;
  }
  function wireReading(kind, id) {
    const rd = $('rd');
    $('rFull').onclick = async e => { e.target.disabled = true; e.target.textContent = 'Skye’s writing…';
      try { const r = await X.api.reading(kind, id, 'full'); rd.innerHTML = `<div class="read">${esc(r.text)}</div><div class="row"><button class="ghost t" type="button" id="rVoice">🎧 Hear Skye read it</button></div>`; $('rVoice').onclick = voice; }
      catch (x) { e.target.disabled = false; e.target.textContent = '✦ Read it in full'; rd.insertAdjacentHTML('beforeend', `<p class="err">${esc(x.message)}</p>`); } };
    const voice = async e => { const b = e.currentTarget; b.disabled = true; b.textContent = 'Skye’s getting her voice ready…';
      try { const r = await X.api.reading(kind, id, 'voice'); const a = $('aud'); a.src = r.audio; a.hidden = false; a.controls = true; a.play().catch(() => {}); b.textContent = '🎧 Playing'; if (r.text && !rd.querySelector('.read')) rd.insertAdjacentHTML('afterbegin', `<div class="read">${esc(r.text)}</div>`); }
      catch (x) { b.disabled = false; b.textContent = '🎧 Hear Skye read it'; rd.insertAdjacentHTML('beforeend', `<p class="err">${esc(x.message)}</p>`); } };
    $('rVoice').onclick = voice;
  }
  function elemBar(el) { const C = { Fire: '#ff8a3d', Earth: '#6fe38a', Air: '#4fe3e0', Water: '#7b8bff' };
    return `<div class="bar">${Object.entries(el.pct).map(([k, v]) => `<span style="width:${v}%;background:${C[k]}"></span>`).join('')}</div>
      <p class="note" style="margin-top:0">${Object.entries(el.pct).map(([k, v]) => `${k} ${v}%`).join(' · ')} — mostly <b>${el.lead}</b>: “${esc(X.card(X.ELEMCARD[el.lead]).z)}” Light on ${el.low}.</p>`; }

  function showPair(id) {
    const f = S.friends.find(p => p.id === id);
    if (!f) { main.innerHTML = back + '<p class="sub">You two aren’t friends (yet), or they removed the link.</p>'; return; }
    if (!myPl() || !f.placements) { main.innerHTML = back + `<h1>You + ${who(f)}</h1><p class="sub">${!myPl() ? 'Make your chart first' : who(f) + ' hasn’t made their chart yet. Nudge them!'}</p>${!myPl() ? '<div id="maker"></div>' : ''}`; if (!myPl()) window.SSMaker.mount($('maker'), { sky: false }); return; }
    const A = myPl(), B = f.placements, syn = X.synastry(A, B), comp = X.composite([A, B]), ovA = X.overlays(A, B), ovB = X.overlays(B, A), el = X.elements([A, B]);
    const isFol = S.following.some(p => p.id === id);
    const big = ['Sun', 'Moon', 'Venus', 'Mars'];
    main.innerHTML = back + `<h1>You + ${who(f)}</h1><p class="sub">@${esc(f.handle)} · ${sunMoon(B)}</p>
      <div class="day"><b>Today, you two</b><span>${esc(X.dailyLine(comp))}</span></div>
      ${readingBlock('pair', id)}
      <h2>Your charts together</h2>
      <div class="wheel">${window.SSWheel.svg(X.asChart(A), { transits: B.planets })}</div>
      <p class="note" style="text-align:center">Inside: your chart · teal outer ring: ${who(f)}’s planets</p>
      <div class="meters"><div class="mt"><b>${syn.harmony}%</b><small>Flow</small></div><div class="mt"><b>${syn.heat}%</b><small>Heat</small></div></div>
      <p class="note">Flow is how easy you two are together. Heat is friction and spark: not bad, just spicy.</p>
      <h2>Where you hit each other</h2><div>${syn.top.map(h => { const a = X.card(X.PCARD[h.a]), b = X.card(X.PCARD[h.b]);
        return `<div class="asp">Your <b>${h.a}</b> ${h.verb} their <b>${h.b}</b><i>${X.nice(a.m)} ${h.tone > 0 ? '+' : 'vs.'} ${X.nice(b.m)} · ${h.aspect}, ${h.off.toFixed(1)}°</i></div>`; }).join('') || '<p class="empty">No tight hits. A quiet, easy pairing.</p>'}</div>
      ${B.asc != null ? `<h2>You in their houses</h2><div>${ovA.filter(o => big.includes(o.planet)).map(o => `<div class="asp">Your ${o.planet} lands in their <b>${X.ORD[o.house - 1]} house</b><i>${X.nice(X.card(X.PCARD[o.planet]).m)} in their ${X.nice(X.card(String(22 + o.house).padStart(3, '0')).m)}</i></div>`).join('')}</div>` : ''}
      ${A.asc != null ? `<h2>Them in your houses</h2><div>${ovB.filter(o => big.includes(o.planet)).map(o => `<div class="asp">Their ${o.planet} lands in your <b>${X.ORD[o.house - 1]} house</b><i>${X.nice(X.card(X.PCARD[o.planet]).m)} in your ${X.nice(X.card(String(22 + o.house).padStart(3, '0')).m)}</i></div>`).join('')}</div>` : ''}
      <h2>Your “us” chart</h2><div class="wheel">${window.SSWheel.svg(X.asChart(comp))}</div>
      <p class="note">The composite is the midpoint of your two charts: the relationship as its own person.</p>
      <h2>Elements, together</h2>${elemBar(el)}
      <div class="row" style="margin-top:22px"><button class="ghost" type="button" data-fol="${id}" ${f.is_public && !isFol ? '' : 'hidden'}>Follow</button><button class="ghost" type="button" id="rm">Unfriend</button><button class="ghost" type="button" id="bl">Block</button></div>`;
    wireReading('pair', id); wireActions();
    $('rm').onclick = async () => { if (!confirm(`Unfriend ${f.name || f.handle}?`)) return; await X.api.friend(id, 'remove'); location.href = './'; };
    $('bl').onclick = async () => { if (!confirm(`Block ${f.name || f.handle}? They won’t be able to find or friend you.`)) return; await X.api.friend(id, 'block'); location.href = './'; };
  }

  function showGroup(id) {
    const g = S.groups.find(x => x.id === id);
    if (!g) { main.innerHTML = back + '<p class="sub">That group isn’t yours, or it was deleted.</p>'; return; }
    if (g.my_status !== 'joined') { main.innerHTML = back + `<h1>${esc(g.name)}</h1><p class="sub">You’re invited.</p><div class="row" style="justify-content:center"><button class="btn" data-join="${id}">Join the group</button><button class="ghost" data-leave="${id}">No thanks</button></div>`; wireActions(); return; }
    const mem = g.members || [], withChart = mem.filter(m => m.status === 'joined' && m.placements), pls = withChart.map(m => m.placements);
    const mine = g.owner === S.me.id;
    let body = '';
    if (pls.length >= 2) {
      const comp = X.composite(pls), el = X.elements(pls);
      const pairs = []; for (let i = 0; i < withChart.length; i++) for (let j = i + 1; j < withChart.length; j++) pairs.push([withChart[i], withChart[j], X.synastry(withChart[i].placements, withChart[j].placements)]);
      pairs.sort((a, b) => b[2].harmony - a[2].harmony);
      body = `<div class="day"><b>Today, the group</b><span>${esc(X.dailyLine(comp))}</span></div>${readingBlock('group', id)}
        <h2>The group chart</h2><div class="wheel">${window.SSWheel.svg(X.asChart(comp))}</div>
        <p class="note" style="text-align:center">The midpoint of everyone’s charts: the group as its own person.</p>
        <h2>Group elements</h2>${elemBar(el)}
        <h2>Every pair</h2><div>${pairs.map(([a, b, s]) => `<div class="asp"><b>${esc(a.id === S.me.id ? 'You' : a.name || a.handle)} + ${esc(b.id === S.me.id ? 'you' : b.name || b.handle)}</b><i>Flow ${s.harmony}% · Heat ${s.heat}%${s.top[0] ? ` · ${s.top[0].a} ${s.top[0].verb} ${s.top[0].b}` : ''}</i></div>`).join('')}</div>`;
    } else body = '<p class="sub">The group chart shows up once at least 2 people have joined with a chart.</p>';
    main.innerHTML = back + `<h1>${esc(g.name)}</h1><p class="sub">${esc((KINDS.find(k => k[0] === g.kind) || [, ''])[1])} · ${mem.length} people</p>
      <div class="list">${mem.map(m => `<div class="p"><span class="av">${ini(m.name || m.handle)}</span><span class="tx"><b>${m.id === S.me.id ? 'You' : who(m)}</b><small>${m.status === 'invited' ? 'Invited' : sunMoon(m.placements)}</small></span>${mine && m.id !== S.me.id ? `<span class="acts"><button class="ghost" data-rmm="${m.id}" aria-label="Remove ${who(m)}">✕</button></span>` : ''}</div>`).join('')}</div>
      ${mine ? '<div class="row"><button class="ghost" type="button" id="addM">＋ Add friends</button></div>' : ''}
      ${body}
      <div class="row" style="margin-top:22px">${mine ? '<button class="ghost" type="button" id="delG">Delete group</button>' : `<button class="ghost" type="button" data-leave="${id}">Leave group</button>`}</div>`;
    if (pls.length >= 2) wireReading('group', id);
    wireActions();
    main.querySelectorAll('[data-rmm]').forEach(b => b.onclick = async () => { await X.api.group('remove', { p_group: id, p_members: [b.dataset.rmm] }); S = await X.api.social(); showGroup(id); });
    const del = $('delG'); if (del) del.onclick = async () => { if (!confirm('Delete this group for everyone?')) return; await X.api.group('delete', { p_group: id }); location.href = './'; };
    const add = $('addM'); if (add) add.onclick = () => {
      const inG = new Set(mem.map(m => m.id)), avail = S.friends.filter(p => !inG.has(p.id));
      openSheet(`<h3>Add to ${esc(g.name)}</h3>${avail.length ? avail.map(p => `<label class="chk"><input type="checkbox" value="${p.id}"> ${who(p)}</label>`).join('') : '<p>Everyone you’re friends with is already in. Invite more people!</p>'}<div class="err" id="aE"></div>
        <div class="row">${avail.length ? '<button class="btn" id="aS" type="button">Add</button>' : '<button class="btn" data-invite type="button">＋ Invite friends</button>'}<button class="ghost" data-close type="button">Cancel</button></div>`);
      wireInvite(box);
      const s = $('aS'); if (s) s.onclick = async () => { const ids = [...box.querySelectorAll('.chk input:checked')].map(i => i.value); try { await X.api.group('add', { p_group: id, p_members: ids }); S = await X.api.social(); closeSheet(); showGroup(id); } catch (e) { $('aE').textContent = e.message; } };
    };
  }
  addEventListener('popstate', () => S && route());
  addEventListener('ss-chart', () => setTimeout(async () => { if (!Acct.user) return; await X.syncMe(); S = await X.api.social(); route(); }, 600));
})();
</script>
<script src="../js/nav.js?v=28" defer></script>
<script src="../js/feedback.js?v=20" defer></script>
</body>
</html>
