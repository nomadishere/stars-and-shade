<style>
  /* A classroom in the night sky: the Oracle teaches from the front, the lesson is chalk on a slate board,
     the syllabus is a report card. Gold = her lettering and anything you tap. */
  @font-face { font-family: 'Astro'; src: url('../fonts/dejavu-astro.woff2') format('woff2'); font-weight: 700; font-display: block; }
  :root {
    color-scheme: dark;
    --night: #07050d; --glass: rgba(24, 13, 40, .66); --line: rgba(255, 170, 230, .18);
    --ink: #f6eefb; --chalk: #f3efe6; --muted: #c2b3d6; --gold: #f2c466; --gold-hi: #ffe3a3; --gold-deep: #c48a2c; --pink: #ff5fb0; --violet: #9b6bff; --teal: #3fe0d0;
    --good: #7cf0b5; --bad: #ff8fa3;
    --display: 'Comfortaa', 'Trebuchet MS', system-ui, sans-serif; --body: 'Figtree', system-ui, -apple-system, sans-serif; --astro: 'Astro', 'DejaVu Sans', sans-serif;
    --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--night); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; }
  body { background: radial-gradient(ellipse 90% 50% at 50% 0%, rgba(214, 60, 160, .4), transparent 70%),
                     radial-gradient(ellipse 60% 40% at 0% 60%, rgba(110, 60, 255, .22), transparent 70%), var(--night); background-attachment: fixed; }
  #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--gold); }
  em { color: var(--gold-hi); font-style: normal; font-weight: 600; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  [hidden] { display: none !important; }
  .astro { font-family: var(--astro); font-weight: 700; }
  .muted { color: var(--muted); }
  .btn { border: 0; padding: 13px 22px; border-radius: 999px; font-weight: 700; font-size: 16px; color: #1b1206; background: linear-gradient(180deg, var(--gold-hi), var(--gold) 45%, var(--gold-deep)); box-shadow: 0 0 24px rgba(242,196,102,.4); }
  .btn.sm { padding: 11px 18px; font-size: 15px; }
  .ghost { border: 1px solid var(--line); background: rgba(255,255,255,.05); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 15px; }
  .btn:disabled, .ghost:disabled { opacity: .35; box-shadow: none; filter: grayscale(.4); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .wrap { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: calc(var(--st) + 12px) 14px calc(var(--sb) + 110px); }

  /* top bar */
  .top { display: flex; align-items: center; gap: 10px; }
  .top .pill { display: flex; padding: 6px 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); text-decoration: none; font-size: 13px; font-weight: 600; color: var(--ink); align-items: center; gap: 6px; }
  .top a.pill img { height: 22px; display: block; }
  .top .sp { flex: 1; }

  /* the teacher */
  .teacher { display: flex; align-items: center; gap: 14px; margin: 16px 0 12px; }
  .torb { position: relative; flex: 0 0 74px; height: 74px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd6f0 0%, #ff5fb0 30%, #9b3cff 62%, #3b1a7a 100%);
    box-shadow: 0 0 30px rgba(255,95,176,.55), 0 0 70px rgba(155,107,255,.35), inset 0 0 20px rgba(255,255,255,.25); animation: breathe 3.4s ease-in-out infinite; }
  .torb::after { content: '✦'; position: absolute; top: -8px; right: 2px; color: var(--gold); text-shadow: 0 0 10px var(--gold); }
  .speaking .torb { animation: talk .5s ease-in-out infinite; }
  .listening .torb { box-shadow: 0 0 34px rgba(124,240,181,.6), 0 0 70px rgba(155,107,255,.35), inset 0 0 20px rgba(255,255,255,.25); }
  @keyframes breathe { 50% { transform: scale(1.05); } }
  @keyframes talk { 50% { transform: scale(1.1); filter: brightness(1.2); } }
  .tinfo { flex: 1; min-width: 0; display: grid; gap: 6px; }
  .tinfo .name { font: 700 13px var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }

  /* the chalkboard */
  #schoolSheet { position: relative; border-radius: 22px; padding: 18px 18px 22px;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.05), transparent 60%),
      repeating-linear-gradient(115deg, rgba(255,255,255,.012) 0 2px, transparent 2px 6px),
      linear-gradient(160deg, #1f2b2a, #142020 60%, #0f1919);
    border: 10px solid #3a2617; box-shadow: inset 0 0 40px rgba(0,0,0,.6), 0 18px 50px rgba(0,0,0,.6), 0 0 0 1px rgba(242,196,102,.25); }
  #schoolSheet::after { content: ''; position: absolute; left: 12%; right: 12%; bottom: -10px; height: 8px; border-radius: 0 0 6px 6px; background: #4a3220; box-shadow: 0 4px 10px rgba(0,0,0,.5); }
  #schoolSheet h2 { margin: 0; font: 700 clamp(26px, 7.5vw, 36px)/1.12 var(--display); color: var(--chalk); text-shadow: 0 0 1px rgba(255,255,255,.6), 0 0 18px rgba(255,255,255,.12); }
  #schoolSheet h3 { margin: 18px 0 6px; font: 700 13px var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--pink); }
  #schoolSheet p { margin: 0 0 10px; color: #e7e4dc; }
  .kick { font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: rgba(243,239,230,.6); margin-bottom: 6px; }
  .zing { font: 700 clamp(19px, 5.4vw, 24px)/1.25 var(--display); color: var(--chalk); margin: 10px 0 8px; }
  .motto { display: inline-block; font: 700 15px var(--astro); letter-spacing: .06em; color: #1b1206; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); padding: 6px 12px; border-radius: 10px; }
  .facts { font-size: 13.5px; color: rgba(243,239,230,.65); margin-top: 10px; }
  .sctop { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--gold); font-weight: 600; }
  .sm2 { padding: 6px 10px; font-size: 13px; white-space: nowrap; flex: 0 0 auto; }
  .scbar { height: 6px; border-radius: 6px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 8px; }

  #svid { width: min(34%, 160px); aspect-ratio: 9/16; border-radius: 14px; background: #000; object-fit: cover; box-shadow: 0 0 24px rgba(255,95,176,.25); border: 2px solid rgba(243,239,230,.2); }
  #scBody { margin-top: 12px; padding-bottom: 96px; }

  /* chalk drawings */
  .art { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin: 4px 0 16px; }
  .art span { display: grid; justify-items: center; gap: 2px; }
  .art b { font: 700 38px/1 var(--astro); color: var(--chalk); text-shadow: 0 0 12px rgba(255,255,255,.25); }
  .art small { font-size: 12px; color: rgba(243,239,230,.6); }
  .art.eqn i { font: 700 28px var(--display); color: var(--gold); align-self: center; font-style: normal; }
  .art.wheel { gap: 10px; } .art.wheel b { font-size: 28px; }

  /* syllabus / report card */
  .levels { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 8px; }
  .levels button { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 11px 12px; border-radius: 14px; border: 1px solid rgba(243,239,230,.14); background: rgba(255,255,255,.035); }
  .levels .num { flex: 0 0 34px; height: 34px; border-radius: 50%; display: grid; place-content: center; font-weight: 700; border: 1px solid rgba(243,239,230,.25); }
  .levels .t { flex: 1; display: grid; } .levels .t small { color: rgba(243,239,230,.6); font-size: 12.5px; }
  .levels .pr { font-size: 12px; color: rgba(243,239,230,.6); }
  .levels .open .num { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 14px rgba(242,196,102,.35); }
  .levels .done .num { background: rgba(124,240,181,.15); border-color: rgba(124,240,181,.5); color: var(--good); }
  .levels .lock { opacity: .45; }
  .big { font: 700 56px/1 var(--astro); color: var(--gold); text-shadow: 0 0 26px rgba(242,196,102,.6); }
  .qh { font-size: clamp(20px, 5.6vw, 26px) !important; margin-bottom: 12px !important; }
  .choices { display: grid; gap: 9px; width: 100%; }
  .choices button { text-align: left; border-radius: 14px; border: 1px solid rgba(243,239,230,.2); background: rgba(255,255,255,.05); padding: 13px 15px; font-size: 15.5px; color: var(--chalk); }
  .choices button.ok { border-color: var(--good); background: rgba(124,240,181,.14); }
  .choices button.no { border-color: var(--bad); background: rgba(255,143,163,.12); }
  .fb { min-height: 24px; font-size: 15px; margin-top: 10px; } .fb b { color: var(--gold); }
  .mtg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mt { border-radius: 14px; border: 1.5px dashed rgba(243,239,230,.3); background: rgba(255,255,255,.03); padding: 10px 6px; display: grid; justify-items: center; gap: 2px; min-height: 86px; color: var(--chalk); }
  .mt b { font: 700 24px/1 var(--astro); color: var(--gold); } .mt span { font-weight: 700; font-size: 14px; } .mt i { font: 700 12px var(--astro); color: var(--good); font-style: normal; }
  .mt.ok { border-style: solid; border-color: var(--good); background: rgba(124,240,181,.1); }
  .mch { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
  .mc { padding: 10px 14px; border: 0; border-radius: 12px; font: 700 14px var(--astro); color: #1b1206; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); }
  .mc.sel { outline: 3px solid #fff; box-shadow: 0 0 20px rgba(242,196,102,.7); }
  .shake { animation: shake .4s; } @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  .reading { padding: 14px; border-radius: 16px; background: rgba(255,95,176,.08); border: 1px solid rgba(255,95,176,.25); min-height: 40px; }
  .reading .eq { font: 700 18px/1.3 var(--display); color: var(--gold); } .reading .mm { margin: 6px 0; font-size: 14.5px; }
  .reading:empty { display: none; }
  .inp { width: 100%; font: 600 17px var(--body); color: var(--ink); background: rgba(0,0,0,.3); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }

  /* the desk: back / next always in reach */
  #scFoot { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; gap: 10px; padding: 12px 16px calc(var(--sb) + 14px);
    background: linear-gradient(transparent, rgba(7,5,13,.92) 35%); }
  #scFoot > * { max-width: 360px; }
  @media (min-width: 800px) { #scFoot { left: 50%; right: auto; width: 760px; transform: translateX(-50%); } }

  #toast { position: fixed; z-index: 60; left: 50%; top: calc(var(--st) + 70px); transform: translate(-50%, -20px); padding: 10px 18px; border-radius: 999px; font-weight: 700; color: var(--gold); opacity: 0; transition: all .4s; pointer-events: none; white-space: nowrap; background: var(--glass); border: 1px solid var(--line); }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  .spark { position: fixed; z-index: 61; left: 0; top: 0; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .torb { animation: none !important; } }
  #makerDlg { position: fixed; inset: 0; z-index: 30; background: rgba(8,4,20,.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 18px 14px 40px; }
  #makerDlg[hidden] { display: none !important; }
  #makerDlg .mk { width: 100%; max-width: 460px; margin-top: 4vh; padding: 16px; border-radius: 20px; background: rgba(30,40,38,.96); border: 1px solid rgba(255,255,255,.15); }
  #makerDlg [data-x] { float: right; }
  button.pill { font: inherit; color: inherit; cursor: pointer; }
  .you { margin: 18px 0 6px; padding: 14px; border-radius: 16px; border: 1px solid rgba(255,111,181,.45); background: rgba(255,111,181,.07); }
  .you .yk { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #ff8fc8; margin-bottom: 4px; }
  .you p { margin: 0 0 6px; } .you b { color: #ffe3a3; }
  .ywheel svg { width: 100%; max-width: 360px; height: auto; display: block; margin: 6px auto 0; font-family: inherit; }
  .ywheel.big svg { max-width: 520px; }
  .sswkey { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; margin: 6px 0; font-size: 13px; }
  .sswkey b { color: #f2c466; font-family: 'Astro'; font-weight: 400; }

  /* quizzes: Back/Next sit under the answers instead of floating over them */
  body.inq #scFoot { position: static; transform: none; width: auto; max-width: 760px; margin: 18px auto 0; background: none; padding: 0 16px calc(var(--sb) + 30px); }
  body.inq #scBody { padding-bottom: 8px; }
  /* ---- learn your way ---- */
  .ways { display: grid; gap: 10px; }
  .way { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; border-radius: 16px; border: 1.5px solid rgba(243,239,230,.2); background: rgba(255,255,255,.04); color: var(--chalk); }
  .way .we { font-size: 28px; flex: 0 0 36px; text-align: center; }
  .way .wt { flex: 1; display: grid; gap: 2px; } .way .wt b { font-size: 16.5px; } .way .wt small { color: rgba(243,239,230,.7); font-size: 13.5px; line-height: 1.35; }
  .way .wc { flex: 0 0 28px; height: 28px; border-radius: 8px; border: 2px solid rgba(243,239,230,.4); display: grid; place-content: center; font-weight: 800; color: #1b1206; }
  .way[aria-pressed="true"] { border-color: var(--gold); background: rgba(242,196,102,.12); box-shadow: 0 0 18px rgba(242,196,102,.18); }
  .way[aria-pressed="true"] .wc { background: var(--gold); border-color: var(--gold); } .way[aria-pressed="true"] .wc::after { content: '✓'; }
  .waychip { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 10px; margin: 0 0 12px; padding: 10px 14px; border-radius: 14px; border: 1px dashed rgba(242,196,102,.45); background: rgba(242,196,102,.06); color: var(--chalk); font-size: 14.5px; text-align: left; }
  .waychip b { color: var(--gold); font-size: 14px; flex: 0 0 auto; }
  .plan { margin: 0 0 14px; padding: 12px 14px; border-radius: 14px; background: rgba(63,224,208,.08); border: 1px solid rgba(63,224,208,.35); font-size: 15px; }
  .plain { margin: 10px 0 0 !important; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.05); font-size: 15px; }
  .hook, .review { margin: 14px 0 6px; padding: 14px; border-radius: 16px; border: 1px solid rgba(155,107,255,.45); background: rgba(155,107,255,.08); }
  .hook .yk, .review .yk { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #c7a8ff; margin-bottom: 6px; }
  .hook p { margin: 0 0 8px !important; } .hook b { color: var(--gold); }
  .review { margin: 0 0 14px; } .rv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .rvc { display: grid; gap: 4px; justify-items: center; padding: 12px 6px; min-height: 76px; border-radius: 12px; border: 1px solid rgba(243,239,230,.25); background: rgba(255,255,255,.04); color: var(--chalk); }
  .rvc b { font-size: 14px; } .rvc span { font: 700 13px var(--astro); color: var(--gold); } .rvc small { display: block; font: 400 12px var(--body); color: rgba(243,239,230,.7); margin-top: 4px; }
  .rvc.flip { border-color: var(--gold); background: rgba(242,196,102,.08); }
  details.more { margin-top: 14px; } details.more summary { cursor: pointer; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(243,239,230,.2); background: rgba(255,255,255,.04); color: var(--gold); font-weight: 700; list-style: none; }

  body.lw-read #schoolSheet p, body.lw-read .choices button, body.lw-read .plan, body.lw-read .way small { font-size: 18px !important; line-height: 1.75; letter-spacing: .02em; word-spacing: .12em; }
  body.lw-read #schoolSheet h3 { font-size: 14px; } body.lw-read .facts { font-size: 15.5px; line-height: 1.6; }
  body.lw-read .zing { line-height: 1.4; letter-spacing: .01em; } body.lw-read #schoolSheet p { max-width: 62ch; }
  /* on the spectrum: calm motion */

  body.lw-calm .shake { animation: none !important; }
  body.lw-calm .scbar i { transition: none; }

<script>
  // quiet chalk-dust stars
  (() => { const cv = document.getElementById('stars'), cx = cv.getContext('2d'); let st = [];
