      const busy = e && /limit|concurren|capacity|busy|too many|429/i.test(why);
      if (busy) { note('Skye’s got a full house right now. Everyone wants a reading tonight. Give it a minute, then tap again.'); return; }
      note(voice ? (micErr ? 'Skye can’t hear you yet. Allow the microphone (Settings › Safari › Microphone), then tap the orb again, or just type.' : (navigator.onLine === false ? 'You’re offline. Reconnect, then tap the orb again.' : 'Skye couldn’t connect just now. Tap the orb to try again, or just type.')) : 'Couldn’t reach Skye. Try again in a sec.');
    } finally { starting = false; }
  }
  async function fallbackWs() {
    notTurn('Reconnecting… one sec'); setPhase('connecting', 'One sec…');
    try { location.search.includes('mode=') || history.replaceState(null, '', location.pathname + '?mode=ws'); } catch (e) {}
    starting = false; await end(true); start(true);
  }
  async function end(already) {
    const c = conv; conv = null; mode = null; cancelAnimationFrame(raf); core.style.setProperty('--s', 1);
    setPhase('idle'); notTurn(''); document.body.classList.remove('voice-live');
    orb.classList.remove('live'); document.body.classList.remove('live-any'); $('mic').setAttribute('aria-pressed', false); skipGreeting = false; $('orbLbl').textContent = 'Tap to talk'; status('');
    if (c && !already) { try { await c.endSession(); } catch (e) {} }
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  orb.onclick = async () => {
    try { chimeCtx = chimeCtx || new (window.AudioContext || window.webkitAudioContext)(); chimeCtx.resume(); } catch (e) {}
    if (phase === 'connecting') { notTurn('Hang on, she’s almost here… wait for the chime'); return; }
    if (conv && conv.isVoice) { if (mode !== 'speaking') yourTurn(); return; }   // already live: a second tap never hangs up
    if (conv) await end();          // switch from typing to talking
    start(true);
  };
  $('end').onclick = () => end();
  $('end2').onclick = () => end();
  $('mic').onclick = () => orb.onclick();

  async function ask(text) {
    text = text.trim(); if (!text) return;
    say('me', text); lastTyped = text;
    if (!conv) { await start(false); if (!conv) return; }
    typing();
    try { conv.sendUserMessage(text); } catch (e) { note('That didn’t send. Try again.'); }
  }
  // ---- their own chart: made right here in the chat (form card or by asking her), or anywhere else on the site
  const chartText = () => window.SSMaker.text();
  function chartCard(saved) {
    const el = document.createElement('div'); el.className = 'msg ai chartcard ssm';
    let wheel = ''; try { wheel = '<div class="cwheel">' + window.SSWheel.svg(window.SSChart.compute(saved.input), {}) + '</div>' + window.SSWheel.legend(); } catch (e) {}
    el.innerHTML = '<span class="who">Your chart</span>' + wheel + window.SSMaker.big3(saved) +
      '<div class="ssm-row"><button class="ssm-btn" type="button" data-share>📸 Share my chart</button><a class="ssm-gh" href="../chart/">Full chart</a><a class="ssm-gh" href="../learn/?sky=1">3D sky ✦</a></div>';
    el.querySelector('[data-share]').onclick = e => window.SSShare.share(saved, e.currentTarget);
    try { window.SSShare.prepare(saved); } catch (e) {}
    window.SSMaker.style(); log.appendChild(el); log.scrollTop = log.scrollHeight; document.body.classList.add('chatting'); addReadChip();
  }
  // when Skye checks the sky, show it: today's planets around your chart (or just the sky if no chart yet)
  let lastSky = '';
  function skyCard(date) {
    const key = date || 'now'; if (lastSky === key && log.querySelector('.skycard:last-of-type')) return; lastSky = key;
    const t = window.SSSky.timeFor(date), pos = window.SSSky.positions(t), saved = window.SSMaker.get();
    const when = t.date.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    const retro = pos.filter(p => p.retro).map(p => p.name);
    let pic = ''; try { if (saved) pic = '<div class="cwheel">' + window.SSWheel.svg(window.SSChart.compute(saved.input), { transits: pos }) + '</div>'; } catch (e) {}
    const list = pos.map(p => `<span><b class="astro">${{ Sun: '☉', Moon: '☽', Mercury: '☿', Venus: '♀', Mars: '♂', Jupiter: '♃', Saturn: '♄', Uranus: '♅', Neptune: '♆', Pluto: '♇' }[p.name]}</b> ${p.name} ${p.sign}${p.retro ? ' <i>Rx</i>' : ''}</span>`).join('');
    const el = document.createElement('div'); el.className = 'msg ai skycard';
    el.innerHTML = `<span class="who">The sky · ${when}</span>${pic}${pic ? '<div class="note2">Teal ring: the planets ' + (date ? 'that day' : 'right now') + ' · inside: your birth chart</div>' : ''}<div class="slist">${list}</div><div class="note2">${window.SSSky.moonPhase(t)} · Retrograde: ${retro.length ? retro.join(', ') : 'nothing'}</div>`;
    log.appendChild(el); log.scrollTop = log.scrollHeight; document.body.classList.add('chatting');
  }
  function addReadChip() { $('starters').querySelector('[data-make]')?.remove(); if ($('starters').querySelector('[data-chart]')) return;
    const b = document.createElement('button'); b.type = 'button'; b.textContent = '✦ Read my chart'; b.dataset.chart = '1'; $('starters').prepend(b); }
  function makerCard() {
    const open = log.querySelector('.makercard'); if (open) { open.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    const el = document.createElement('div'); el.className = 'msg ai makercard';
    el.innerHTML = '<span class="who">Skye</span><div></div>'; log.appendChild(el); document.body.classList.add('chatting');
    window.SSMaker.mount(el.lastChild, { oracle: false, sky: false, title: 'Make your free chart', onMade: () => { el.remove(); readChart(); } });
    log.scrollTop = log.scrollHeight; setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
  }
  // today's sky questions about their own chart: tap one after another, no need to leave the chat
  function addSkyChips() { try { const sv = window.SSMaker.get(); if (!sv || !window.SSSky.questions) return;
    const qs = window.SSSky.questions(window.SSChart.compute(sv.input), 6), st = $('starters'), after = st.querySelector('[data-chart]');
    qs.reverse().forEach(q => { if ([...st.children].some(b => b.textContent === q)) return; const b = document.createElement('button'); b.type = 'button'; b.textContent = q; b.dataset.sky = '1';
      after ? after.after(b) : st.prepend(b); }); } catch (e) { console.warn('sky chips', e); } }
  if (chartText()) addReadChip();
  else { const b = document.createElement('button'); b.type = 'button'; b.textContent = '✦ Make my free chart'; b.dataset.make = '1'; $('starters').prepend(b); }
  addSkyChips();
  async function readChart() { const s = window.SSMaker.get(); const t = chartText(); if (!t) return makerCard(); chartCard(s); lastTyped = t; if (ACC) ACC.log('me', '✦ Read my chart');
    if (!conv) { await start(false); if (!conv) return; } typing(); try { conv.sendUserMessage(t); } catch (e) {} }

  $('f').onsubmit = (e) => { e.preventDefault(); const v = $('q').value; $('q').value = ''; ask(v); };
  $('starters').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.chart) readChart(); else if (b.dataset.make) makerCard(); else ask(b.textContent); };
  { const qp = new URLSearchParams(location.search); if (qp.get('chart')) setTimeout(readChart, 400); else if (qp.get('make')) setTimeout(makerCard, 300); else if (qp.get('ask')) setTimeout(() => ask(qp.get('ask').slice(0, 300)), 500); }

  // ---- accounts: history, the sign-in pill, chart sync
  let shownFor = null;
  async function showHistory(u, prof) {
    if (!u || shownFor === u.id) return; shownFor = u.id;
    const rows = await ACC.recent(40); if (!rows.length) return;
    const keep = [...log.children]; keep.forEach(e => e.remove());
    const d1 = document.createElement('div'); d1.className = 'divider'; d1.textContent = 'Earlier'; log.appendChild(d1);
    rows.forEach(r => { if (r.role !== 'note') say(r.role, r.text, true); });
    const d2 = document.createElement('div'); d2.className = 'divider'; d2.textContent = 'Now'; log.appendChild(d2);
    keep.forEach(e => log.appendChild(e));
    log.scrollTop = log.scrollHeight;
  }
  if (ACC) {
    $('acct').onclick = () => ACC.open();
    ACC.onChange((u, prof) => {
      $('acct').textContent = u ? '✦ ' + ((prof && prof.name) || 'Account') : 'Sign in';
      $('acct').classList.toggle('on', !!u);
      document.querySelectorAll('.savecard').forEach(e => e.remove());
      if (u) showHistory(u, prof);
    });
    addEventListener('ss-chart', () => { if (window.SSMaker.get()) addReadChip(); });
    setTimeout(() => { if (!ACC.user && !log.querySelector('.savecard')) { const c = document.createElement('div'); c.className = 'savecard';
      c.innerHTML = 'Want her to remember you? <button type="button">Make a free account</button> so your chats and chart are saved.'; c.querySelector('button').onclick = () => ACC.open('up'); log.appendChild(c); document.body.classList.add('chatting'); } }, 1500);
  } else $('acct').hidden = true;

  // ---- a quiet star field
  const cv = $('stars'), cx = cv.getContext('2d'); let st = [];
  function sizeStars() { const d = Math.min(devicePixelRatio || 1, 2); cv.width = innerWidth * d; cv.height = innerHeight * d; cx.setTransform(d, 0, 0, d, 0, 0);
    st = Array.from({ length: 140 }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 1.3 + .2, p: Math.random() * 6.28 })); }
  function drawStars(t) { cx.clearRect(0, 0, innerWidth, innerHeight);
    for (const s of st) { cx.globalAlpha = .35 + .35 * Math.sin(t / 900 + s.p); cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.28); cx.fill(); }
    requestAnimationFrame(drawStars); }
  addEventListener('resize', sizeStars); sizeStars(); requestAnimationFrame(drawStars);
})();
</script>
