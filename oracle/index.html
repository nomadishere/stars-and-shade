<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>The Shade Oracle · Stars &amp; Shade</title>
<meta name="theme-color" content="#07050d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  /* Test page for The Shade Oracle (hidden: not linked from the site, noindex).
     One night world: a breathing pink orb you tap to talk, her words as glass bubbles, a typing box. */
  :root {
    color-scheme: dark;
    --night: #07050d; --glass: rgba(24, 13, 40, .66); --line: rgba(255, 170, 230, .18);
    --ink: #f6eefb; --muted: #c2b3d6; --gold: #f2c466; --gold-hi: #ffe3a3; --gold-deep: #c48a2c; --pink: #ff5fb0; --violet: #9b6bff; --teal: #3fe0d0;
    --display: 'Comfortaa', 'Trebuchet MS', system-ui, sans-serif; --body: 'Figtree', system-ui, -apple-system, sans-serif;
    --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--night); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
    background: radial-gradient(ellipse 90% 60% at 50% 18%, rgba(214, 60, 160, .45), transparent 65%),
                radial-gradient(ellipse 70% 50% at 15% 70%, rgba(110, 60, 255, .25), transparent 70%),
                radial-gradient(ellipse 60% 40% at 90% 85%, rgba(63, 224, 208, .14), transparent 70%), var(--night); }
  #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--gold); }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  header { position: relative; z-index: 2; padding: calc(var(--st) + 14px) 16px 4px; display: flex; align-items: center; gap: 10px; }
  header a.home { display: flex; padding: 6px 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); }
  header a.home img { height: 24px; width: auto; display: block; }
  header .sp { flex: 1; }
  .tag { font-size: 11.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; }

  #stage { position: relative; z-index: 2; display: grid; justify-items: center; gap: 6px; padding: 6px 16px 8px; text-align: center; transition: all .5s; }
  #stage h1 { margin: 0; font: 700 clamp(26px, 8vw, 38px)/1.1 var(--display); color: var(--gold); text-shadow: 0 0 22px rgba(242,196,102,.45); }
  #stage p { margin: 0; color: var(--muted); font-size: 14.5px; max-width: 32ch; }
  .chatting #stage h1 { font-size: 22px; } .chatting #stage p { display: none; }

  /* the orb */
  #orb { position: relative; width: 168px; height: 168px; border: 0; border-radius: 50%; margin: 10px 0 4px; background: none; padding: 0; transition: width .5s, height .5s; }
  .chatting #orb { width: 96px; height: 96px; margin: 2px 0; }
  #orb .core { position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd6f0 0%, #ff5fb0 30%, #9b3cff 62%, #3b1a7a 100%);
    box-shadow: 0 0 40px rgba(255, 95, 176, .65), 0 0 90px rgba(155, 107, 255, .45), inset 0 0 30px rgba(255,255,255,.25);
    transform: scale(var(--s, 1)); transition: transform .08s linear; }
  #orb .ring { position: absolute; inset: -14px; border-radius: 50%; border: 1.5px solid rgba(242, 196, 102, .55); animation: spin 14s linear infinite; }
  #orb .ring::before { content: '✦'; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); color: var(--gold); font-size: 16px; text-shadow: 0 0 10px var(--gold); }
  #orb .ring2 { inset: -26px; border-color: rgba(63, 224, 208, .3); animation-duration: 22s; animation-direction: reverse; }
  #orb .ring2::before { content: '☽'; color: var(--teal); text-shadow: 0 0 10px var(--teal); }
  #orb .lbl { position: absolute; inset: 0; display: grid; place-content: center; font: 700 15px var(--body); color: #fff; text-shadow: 0 1px 8px rgba(60, 0, 60, .8); letter-spacing: .02em; }
  .chatting #orb .lbl { font-size: 12px; }
  #orb:not(.live) .core { animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.06); filter: brightness(1.15); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { font-size: 13px; color: var(--muted); min-height: 18px; letter-spacing: .04em; }

  /* transcript */
  #log { position: relative; z-index: 2; flex: 1; overflow-y: auto; padding: 8px 14px 12px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
  .msg { max-width: 86%; padding: 11px 14px; border-radius: 20px; font-size: 16px; line-height: 1.4; animation: pop .35s cubic-bezier(.2,.8,.2,1); white-space: pre-wrap; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  .msg.ai { align-self: flex-start; background: var(--glass); border: 1px solid var(--line); border-bottom-left-radius: 6px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .msg.me { align-self: flex-end; background: linear-gradient(135deg, rgba(255,95,176,.85), rgba(155,107,255,.85)); border-bottom-right-radius: 6px; color: #fff; }
  .msg .who { display: block; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin-bottom: 3px; }
  .cards { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .cards a { text-decoration: none; font-size: 13px; font-weight: 600; color: #1b1206; padding: 5px 10px; border-radius: 999px; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); }
  .typing { align-self: flex-start; color: var(--muted); font-size: 22px; letter-spacing: 4px; padding: 0 10px; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .note { align-self: center; font-size: 13px; color: var(--muted); text-align: center; max-width: 34ch; }

  /* starter chips + composer */
  #starters { position: relative; z-index: 2; display: flex; gap: 8px; overflow-x: auto; padding: 0 14px 10px; scrollbar-width: none; }
  #starters::-webkit-scrollbar { display: none; }
  #starters button { flex: 0 0 auto; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass); font-size: 14px; white-space: nowrap; }
  form { position: relative; z-index: 2; display: flex; gap: 8px; padding: 8px 12px calc(var(--sb) + 12px); background: linear-gradient(transparent, rgba(7,5,13,.85) 40%); }
  #q { flex: 1; min-width: 0; font: 16px var(--body); color: var(--ink); background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 13px 18px; outline: none; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  #q::placeholder { color: var(--muted); }
  #send { flex: 0 0 auto; width: 50px; border: 0; border-radius: 50%; font-size: 20px; color: #1b1206; background: linear-gradient(180deg, var(--gold-hi), var(--gold) 45%, var(--gold-deep)); box-shadow: 0 0 20px rgba(242,196,102,.4); }
  #end { display: none; border: 1px solid var(--line); background: var(--glass); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  .live-any #end { display: inline-block; }
  #mic { flex: 0 0 auto; width: 50px; border: 1px solid var(--line); border-radius: 50%; font-size: 20px; background: var(--glass); }
  #mic[aria-pressed="true"] { background: linear-gradient(135deg, var(--pink), var(--violet)); border-color: transparent; box-shadow: 0 0 22px rgba(255,95,176,.6); animation: breathe 1.6s ease-in-out infinite; }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<header>
  <a class="home" href="../learn/" aria-label="Back to the Nebula"><img src="../img/logo.png" alt="Stars &amp; Shade"></a>
  <span class="sp"></span>
  <button id="end" type="button">End chat</button>
  <span class="tag">Test</span>
</header>

<section id="stage">
  <button id="orb" type="button" aria-label="Talk to The Shade Oracle"><span class="ring"></span><span class="ring ring2"></span><span class="core"></span><span class="lbl" id="orbLbl">Tap to talk</span></button>
  <div id="status" aria-live="polite"></div>
  <h1>The Shade Oracle</h1>
  <p>Your astrologer bestie. Ask about your sign, your chart, your situationship. She will be honest. Mostly.</p>
</section>

<div id="log" aria-live="polite"></div>

<div id="starters">
  <button type="button">What does my Leo sun say about me?</button>
  <button type="button">Read my Venus in Scorpio</button>
  <button type="button">Quiz me on the mottos</button>
  <button type="button">Why does everyone hate Mercury retrograde?</button>
  <button type="button">What's a rising sign?</button>
</div>

<form id="f" autocomplete="off">
  <input id="q" type="text" placeholder="Ask the Oracle anything…" aria-label="Message The Shade Oracle" enterkeyhint="send">
  <button id="mic" type="button" aria-label="Talk out loud" aria-pressed="false">🎙</button>
  <button id="send" type="submit" aria-label="Send">✦</button>
</form>

<script src="../js/cards.js?v=5"></script>
<script src="../vendor/elevenlabs/client-1.32.1.js"></script>
<script>
(() => {
  const AGENT = 'agent_8901m69xdcabeqet6b778kyp70mh';
  const { Conversation } = window.ElevenLabsClient;
  const $ = id => document.getElementById(id);
  const log = $('log'), orb = $('orb'), core = orb.querySelector('.core');
  let conv = null, mode = null, starting = false, typingEl = null, raf = 0, skipGreeting = false, lastTyped = '';

  // ---- cards she mentions become tappable links into the Nebula
  const CARDS = window.CARDS || [];
  const names = CARDS.map(c => ({ n: c.n, t: c.title, re: new RegExp('\\b' + c.title.replace(/ /g, '\\s+') + '\\b') }));
  function cardLinks(text) {
    const hit = []; for (const c of names) if (c.re.test(text) && !hit.find(h => h.n === c.n)) hit.push(c);
    return hit.slice(0, 4);
  }

  function say(role, text) {
    if (typingEl) { typingEl.remove(); typingEl = null; }
    const el = document.createElement('div'); el.className = 'msg ' + (role === 'ai' ? 'ai' : 'me');
    if (role === 'ai') { const w = document.createElement('span'); w.className = 'who'; w.textContent = 'The Oracle'; el.appendChild(w); }
    el.appendChild(document.createTextNode(text));
    if (role === 'ai') { const l = cardLinks(text); if (l.length) { const box = document.createElement('div'); box.className = 'cards';
      l.forEach(c => { const a = document.createElement('a'); a.href = '../learn/?card=' + c.n; a.textContent = '▶ ' + c.t + ' card'; box.appendChild(a); }); el.appendChild(box); } }
    log.appendChild(el); log.scrollTop = log.scrollHeight;
    document.body.classList.add('chatting');
  }
  function note(t) { const el = document.createElement('div'); el.className = 'note'; el.textContent = t; log.appendChild(el); log.scrollTop = log.scrollHeight; }
  function typing() { if (typingEl) return; typingEl = document.createElement('div'); typingEl.className = 'typing'; typingEl.textContent = '✦✦✦'; log.appendChild(typingEl); log.scrollTop = log.scrollHeight; }
  const status = t => { $('status').textContent = t || ''; };

  // ---- the orb breathes with her voice
  function pulse() {
    cancelAnimationFrame(raf);
    const tick = () => { if (!conv || mode === null) { core.style.setProperty('--s', 1); return; }
      let v = 0; try { v = conv.isVoice ? (mode === 'speaking' ? conv.getOutputVolume() : conv.getInputVolume() * .6) : 0; } catch (e) {}
      core.style.setProperty('--s', (1 + Math.min(.35, v * 1.4)).toFixed(3)); raf = requestAnimationFrame(tick); };
    tick();
  }

  async function start(voice) {
    if (starting) return; starting = true;
    status(voice ? 'Waking her up… allow the microphone' : 'Connecting…');
    try {
      try { if (navigator.audioSession) navigator.audioSession.type = voice ? 'play-and-record' : 'playback'; } catch (e) {}
      const opts = {
        agentId: AGENT,
        libsampleratePath: new URL('../vendor/elevenlabs/libsamplerate-2.1.2.worklet.js', location.href).href,   // self-hosted: no outside download needed for iPhone audio
        connectionType: 'websocket',   // same proven connection for typing and talking (most compatible with iPhone Safari)
        onConnect: () => { status(voice ? 'Listening… go ahead, say something' : ''); },
        onDisconnect: () => { end(true); },
        onError: (m) => { note('Connection hiccup: ' + (m && m.message || m)); },
        onMessage: (m) => { const role = (m.role || m.source) === 'user' ? 'me' : 'ai'; if (role === 'me' && (!conv?.isVoice || m.message.trim() === lastTyped)) return; say(role, m.message); },
        onModeChange: ({ mode: md }) => { mode = md; if (conv && conv.isVoice) status(md === 'speaking' ? 'She’s talking…' : 'Listening…'); else if (md === 'speaking') typing(); }
      };
      if (!voice) opts.textOnly = true;
      conv = await Conversation.startSession(opts);
      conv.isVoice = voice; mode = 'listening';
      orb.classList.add('live'); document.body.classList.add('live-any'); $('mic').setAttribute('aria-pressed', voice);
      $('orbLbl').textContent = voice ? 'Tap to end' : 'Tap to talk';
      pulse();
    } catch (e) {
      conv = null; status(''); console.error('oracle start failed', e);
      window.__lastErr = String(e && (e.message || e.reason || e)) + (e && e.closeCode ? ' (' + e.closeCode + ')' : '');
      note(voice ? 'Couldn’t start voice. Check the microphone permission (Settings › Safari › Microphone) and try again, or just type.' : 'Couldn’t reach the Oracle. Try again in a sec.');
    } finally { starting = false; }
  }
  async function end(already) {
    const c = conv; conv = null; mode = null; cancelAnimationFrame(raf); core.style.setProperty('--s', 1);
    orb.classList.remove('live'); document.body.classList.remove('live-any'); $('mic').setAttribute('aria-pressed', false); skipGreeting = false; $('orbLbl').textContent = 'Tap to talk'; status('');
    if (c && !already) { try { await c.endSession(); } catch (e) {} }
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  orb.onclick = async () => {
    if (conv && conv.isVoice) return end();
    if (conv) await end();          // switch from typing to talking
    start(true);
  };
  $('end').onclick = () => end();
  $('mic').onclick = () => orb.onclick();

  async function ask(text) {
    text = text.trim(); if (!text) return;
    say('me', text); lastTyped = text;
    if (!conv) { await start(false); if (!conv) return; }
    typing();
    try { conv.sendUserMessage(text); } catch (e) { note('That didn’t send. Try again.'); }
  }
  $('f').onsubmit = (e) => { e.preventDefault(); const v = $('q').value; $('q').value = ''; ask(v); };
  $('starters').onclick = (e) => { const b = e.target.closest('button'); if (b) ask(b.textContent); };

  // ---- a quiet star field
  const cv = $('stars'), cx = cv.getContext('2d'); let st = [];
  function sizeStars() { const d = Math.min(devicePixelRatio || 1, 2); cv.width = innerWidth * d; cv.height = innerHeight * d; cx.setTransform(d, 0, 0, d, 0, 0);
    st = Array.from({ length: 140 }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 1.3 + .2, p: Math.random() * 6.28 })); }
  function drawStars(t) { cx.clearRect(0, 0, innerWidth, innerHeight);
    for (const s of st) { cx.globalAlpha = .35 + .35 * Math.sin(t / 900 + s.p); cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.28); cx.fill(); }
    requestAnimationFrame(drawStars); }
  addEventListener('resize', sizeStars); sizeStars(); requestAnimationFrame(drawStars);
})();
</script>
</body>
</html>
